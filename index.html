<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador musical</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #111;
        }
        #controles {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: min(600px, 90%);
            display: flex;
            gap: 8px;
            z-index: 2;
        }
        #youtubeUrl {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #222;
            color: white;
        }
        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            background: white;
            color: #111;
            font-weight: bold;
        }
        #estado {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 13px;
            color: #ccc;
            z-index: 2;
        }
        #reproductor {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #ccc;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #reproductor.visible,
        #reproductor:hover {
            opacity: 0.8;
        }
        #reproductor button {
            padding: 0 6px;
            background: transparent;
            color: white;
            font-size: 16px;
        }
        #barra {
            width: 260px;
            height: 3px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }
        #barraRelleno {
            height: 100%;
            width: 0%;
            background: #bbb;
        }
        #volumen {
            width: 80px;
            accent-color: #bbb;
        }
    </style>
</head>
<body>
    <div id="controles">
        <input id="youtubeUrl" type="url" placeholder="Pega una URL de YouTube">
        <button id="reproducir">Reproducir</button>
    </div>
    <div id="estado">Introduce una URL para comenzar.</div>
    <audio id="audio"></audio>
    <div id="reproductor">
        <button id="playPausa">⏯</button>
        <span id="tiempo">0:00</span>
        <div id="barra"><div id="barraRelleno"></div></div>
        <span id="total">--:--</span>
        <input id="volumen" type="range" min="0" max="1" step="0.01" value="1">
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const audio = document.getElementById("audio");
        const boton = document.getElementById("reproducir");
        const entradaUrl = document.getElementById("youtubeUrl");
        const estado = document.getElementById("estado");
        const volumen = document.getElementById("volumen");
        const tiempoTxt = document.getElementById("tiempo");
        const totalTxt = document.getElementById("total");
        const barra = document.getElementById("barra");
        const barraRelleno = document.getElementById("barraRelleno");

        // TAMAÑO RESPONSIVE
        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", ajustarCanvas);
        ajustarCanvas();

        // BANDAS QUE SE USAN (frecuencia central en Hz)
        const ANCHO_BANDA = 1.25;
        const bandas = [
            { f: 150,  etq: "150 Hz" },   // ritmo grave (bombo y bajo) -> bola
            { f: 8000, etq: "8 kHz" }     // agudos (hi-hats, ritmo fino) -> bola
        ];
        const N = bandas.map(() => 0);
        const medias = N.slice();
        const previos = N.slice();
        const ultimoPulsoBanda = N.slice();
        const pulsosBanda = bandas.map(() => []);
        const pps = N.slice();
        const valores = N.slice();

        // AJUSTES DE NIVEL
        const MEDIA_VEL = 0.015;
        const EXCESO = 5;

        // DETECCIÓN DE PULSOS
        const UMBRAL_EXCESO = 0.05;
        const CAMBIO_MIN = 0.015;
        const INTERVALO_MIN = 150;
        const VENTANA_PPS = 2000;
        const ARRANQUE_MS = 2000;

        // ELECCIÓN DE LA BANDA GUÍA DE LA BOLA
        const PPS_MIN = 2.1;
        const VENTAJA_CAMBIO = 1;
        const ESPERA_CAMBIO = 1500;
        let guia = -1;
        let ultimoCambioGuia = 0;

        // BOLA
        let fuerzaPulso = 0;
        let tempoMs = 400;
        const tiemposGuia = [];
        const FACTOR_RELAJ = 1.7;       // más alto = la bola tarda más en volver
        const CRECE_PROMEDIO = 0.08;
        let radioSuave = 0;
        const SUAVIZADO_BOLA = 0.35;

        // ANILLOS (detectados en 5 kHz, salen de la bola)
        const FREC_ANILLO = 5000;
        const ANILLO_UMBRAL = 0.06;     // cuánto debe superar a su promedio
        const ANILLO_CAMBIO = 0.02;     // subida mínima respecto al frame anterior
        const ANILLO_INTERVALO = 120;   // ms mínimos entre anillos
        const ANILLO_DURACION = 0.7;    // segundos que tarda en desvanecerse
        const ANILLO_ALCANCE = 0.9;     // hasta cuánto crece (× radio)
        const ANILLOS_MAX = 6;
        const anillos = [];
        let medioAnillo = 0;
        let previoAnillo = 0;
        let ultimoAnilloT = 0;

        // DEPURACIÓN
        const MOSTRAR_DEBUG = false;

        let musicaIniciada = false;
        let inicioMusica = 0;
        let ultimoFrame = performance.now();

        // ANALIZADOR DE AUDIO
        let contextoAudio = null;
        let analizador = null;
        let fuenteAudio = null;
        let ganancia = null;
        let datosFrecuencia = null;

        async function prepararAudio() {
            if (!contextoAudio) {
                contextoAudio = new (
                    window.AudioContext || window.webkitAudioContext
                )();
                analizador = contextoAudio.createAnalyser();
                analizador.fftSize = 2048;
                analizador.smoothingTimeConstant = 0.5;
                datosFrecuencia = new Uint8Array(analizador.frequencyBinCount);
                fuenteAudio = contextoAudio.createMediaElementSource(audio);

                // El analizador lee la señal cruda; el volumen se aplica DESPUÉS
                fuenteAudio.connect(analizador);
                ganancia = contextoAudio.createGain();
                ganancia.gain.value = parseFloat(volumen.value);
                analizador.connect(ganancia);
                ganancia.connect(contextoAudio.destination);
            }
            if (contextoAudio.state === "suspended") {
                await contextoAudio.resume();
            }
        }

        volumen.addEventListener("input", () => {
            if (ganancia) ganancia.gain.value = parseFloat(volumen.value);
        });

        // Nivel (0-1) de una frecuencia central
        function nivelEn(f) {
            if (!analizador || audio.paused) return 0;
            const hzPorBin = contextoAudio.sampleRate / analizador.fftSize;
            const maxBin = datosFrecuencia.length - 1;
            const ini = Math.max(1, Math.floor((f / ANCHO_BANDA) / hzPorBin));
            const fin = Math.min(maxBin, Math.ceil((f * ANCHO_BANDA) / hzPorBin));
            if (ini > maxBin) return 0;
            let suma = 0;
            let n = 0;
            for (let i = ini; i <= fin; i++) {
                suma += datosFrecuencia[i];
                n++;
            }
            return n ? suma / n / 255 : 0;
        }

        // Nivel (0-1) de cada banda de la bola
        function leerBandas() {
            const salida = bandas.map(() => 0);
            if (!analizador || audio.paused) return salida;
            analizador.getByteFrequencyData(datosFrecuencia);
            bandas.forEach((b, k) => {
                salida[k] = nivelEn(b.f);
            });
            return salida;
        }

        // CONTROLES PROPIOS
        function formatear(s) {
            s = Math.max(0, Math.floor(s));
            return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
        }

        document.getElementById("playPausa").addEventListener("click", () => {
            if (!audio.src) return;
            if (audio.paused) audio.play();
            else audio.pause();
        });

        // Los controles aparecen al mover el mouse y se esconden a los 2.5 s
        const panel = document.getElementById("reproductor");
        let temporizadorPanel = null;
        window.addEventListener("mousemove", () => {
            panel.classList.add("visible");
            clearTimeout(temporizadorPanel);
            temporizadorPanel = setTimeout(() => {
                panel.classList.remove("visible");
            }, 2500);
        });

        audio.addEventListener("timeupdate", () => {
            tiempoTxt.textContent = formatear(audio.currentTime);
            const d = audio.duration;
            if (isFinite(d) && d > 0) {
                totalTxt.textContent = formatear(d);
                barraRelleno.style.width =
                    Math.min(100, (audio.currentTime / d) * 100) + "%";
            }
        });

        barra.addEventListener("click", e => {
            const d = audio.duration;
            if (!isFinite(d) || d <= 0) return;
            const r = barra.getBoundingClientRect();
            audio.currentTime = ((e.clientX - r.left) / r.width) * d;
        });

        // REPRODUCIR DESDE YOUTUBE
        boton.addEventListener("click", async () => {
            const url = entradaUrl.value.trim();
            if (!/^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url)) {
                estado.textContent = "Introduce una URL válida de YouTube.";
                return;
            }
            try {
                boton.disabled = true;
                estado.textContent = "Cargando música...";
                await prepararAudio();
                audio.src = "/audio?url=" + encodeURIComponent(url);
                audio.load();
                await audio.play();
                musicaIniciada = true;
                inicioMusica = performance.now();
                valores.fill(0);
                medias.fill(0);
                previos.fill(0);
                ultimoPulsoBanda.fill(0);
                pps.fill(0);
                pulsosBanda.forEach(p => (p.length = 0));
                tiemposGuia.length = 0;
                guia = -1;
                ultimoCambioGuia = 0;
                fuerzaPulso = 0;
                tempoMs = 400;
                radioSuave = 0;
                anillos.length = 0;
                medioAnillo = 0;
                previoAnillo = 0;
                ultimoAnilloT = 0;
                barraRelleno.style.width = "0%";
                totalTxt.textContent = "--:--";
                estado.textContent = "Música reproduciéndose.";
            } catch (error) {
                console.error(error);
                estado.textContent =
                    "No se pudo reproducir. Revisa la URL y la consola del servidor.";
            } finally {
                boton.disabled = false;
            }
        });

        // DIBUJAR
        function dibujar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const ahora = performance.now();
            const dt = Math.min(0.05, (ahora - ultimoFrame) / 1000);
            ultimoFrame = ahora;
            const factor = dt * 60;
            const activo = musicaIniciada && !audio.paused;

            const nivel = leerBandas();
            const rapidezMedia =
                ahora - inicioMusica < ARRANQUE_MS ? 0.15 : MEDIA_VEL;

            let pulsoGuia = false;

            for (let k = 0; k < bandas.length; k++) {
                medias[k] += (nivel[k] - medias[k]) * (1 - Math.pow(1 - rapidezMedia, factor));
                const exceso = Math.max(0, nivel[k] - medias[k]);

                const o = Math.min(1, exceso * EXCESO);
                valores[k] += (o - valores[k]) * (o > valores[k] ? 0.6 : 0.2);

                const hayPulso =
                    activo &&
                    ahora - inicioMusica > 500 &&
                    exceso > UMBRAL_EXCESO &&
                    nivel[k] - previos[k] > CAMBIO_MIN &&
                    ahora - ultimoPulsoBanda[k] >= INTERVALO_MIN;

                if (hayPulso) {
                    ultimoPulsoBanda[k] = ahora;
                    pulsosBanda[k].push(ahora);
                    if (k === guia && pps[k] >= PPS_MIN) pulsoGuia = true;
                }

                previos[k] = nivel[k];
                const lista = pulsosBanda[k];
                while (lista.length && ahora - lista[0] > VENTANA_PPS) lista.shift();
                pps[k] = lista.length / (VENTANA_PPS / 1000);
            }

            // ---- ELEGIR LA BANDA GUÍA ----
            let mejor = -1;
            for (let k = 0; k < bandas.length; k++) {
                if (pps[k] < PPS_MIN) continue;
                if (mejor === -1 || pps[k] < pps[mejor]) mejor = k;
            }
            const guiaMuerta = guia === -1 || pps[guia] < PPS_MIN;
            if (mejor !== -1 && mejor !== guia) {
                if (guiaMuerta) {
                    guia = mejor;
                    ultimoCambioGuia = ahora;
                    tiemposGuia.length = 0;
                } else if (
                    pps[mejor] < pps[guia] - VENTAJA_CAMBIO &&
                    ahora - ultimoCambioGuia > ESPERA_CAMBIO
                ) {
                    guia = mejor;
                    ultimoCambioGuia = ahora;
                    tiemposGuia.length = 0;
                }
            }

            // ---- PULSO DE LA BOLA ----
            if (pulsoGuia) {
                fuerzaPulso = 1;
                tiemposGuia.push(ahora);
                while (tiemposGuia.length > 12) tiemposGuia.shift();
                if (tiemposGuia.length >= 5) {
                    const ints = [];
                    for (let i = 1; i < tiemposGuia.length; i++) {
                        ints.push(tiemposGuia[i] - tiemposGuia[i - 1]);
                    }
                    ints.sort((a, b) => a - b);
                    const mediana = ints[Math.floor(ints.length / 2)];
                    tempoMs += (Math.min(900, Math.max(120, mediana)) - tempoMs) * 0.15;
                }
            }
            const framesPorPulso = (tempoMs / 1000) * 60;
            const decaimiento = Math.pow(0.05, 1 / (framesPorPulso * FACTOR_RELAJ));
            fuerzaPulso *= Math.pow(decaimiento, factor);

            const promedio = valores.reduce((a, b) => a + b, 0) / valores.length;

            // ---- BOLA (centrada) ----
            const bolaX = canvas.width / 2;
            const bolaY = canvas.height / 2;
            const radio = Math.min(canvas.width, canvas.height) * 0.23;
            const radioObjetivo =
                radio * (1 + CRECE_PROMEDIO * promedio * 3) + fuerzaPulso * radio * 0.01;
            if (radioSuave === 0) radioSuave = radioObjetivo;
            radioSuave += (radioObjetivo - radioSuave) * (1 - Math.pow(1 - SUAVIZADO_BOLA, factor));

            // ---- ANILLOS (5 kHz) ----
            const n5 = nivelEn(FREC_ANILLO);
            const subidaAnillo = n5 - previoAnillo;
            medioAnillo += (n5 - medioAnillo) * (1 - Math.pow(1 - 0.02, factor));
            const excesoAnillo = Math.max(0, n5 - medioAnillo);
            previoAnillo = n5;

            if (
                activo &&
                ahora - inicioMusica > 1000 &&
                excesoAnillo > ANILLO_UMBRAL &&
                subidaAnillo > ANILLO_CAMBIO &&
                ahora - ultimoAnilloT >= ANILLO_INTERVALO &&
                anillos.length < ANILLOS_MAX
            ) {
                ultimoAnilloT = ahora;
                anillos.push({ t: 0, fuerza: Math.min(1, 0.5 + excesoAnillo * 3) });
            }

            for (let i = anillos.length - 1; i >= 0; i--) {
                const a = anillos[i];
                a.t += dt / ANILLO_DURACION;
                if (a.t >= 1) {
                    anillos.splice(i, 1);
                    continue;
                }
                const suave = 1 - Math.pow(1 - a.t, 2);
                const r = radioSuave + suave * radio * ANILLO_ALCANCE;
                const alfa = Math.pow(1 - a.t, 1.5) * 0.55 * a.fuerza;
                ctx.beginPath();
                ctx.arc(bolaX, bolaY, r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,255,255,${alfa})`;
                ctx.lineWidth = 2 - a.t;
                ctx.stroke();
            }

            // ---- LÍNEA DE LA BOLA ----
            ctx.beginPath();
            for (let i = 0; i <= 240; i++) {
                const a = (i / 240) * Math.PI * 2;
                const x = bolaX + Math.cos(a) * radioSuave;
                const y = bolaY + Math.sin(a) * radioSuave;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.stroke();

            if (MOSTRAR_DEBUG) {
                ctx.fillStyle = "#888";
                ctx.font = "13px Arial";
                ctx.textAlign = "center";
                ctx.fillText(
                    guia === -1
                        ? "sin banda guía"
                        : `guía: ${bandas[guia].etq} · ${pps[guia].toFixed(1)} pulsos/s`,
                    bolaX,
                    bolaY + radio * 1.5
                );
            }

            requestAnimationFrame(dibujar);
        }
        dibujar();
    </script>
</body>
</html>
