<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador musical</title>
    <style>
        body {
            margin: 0;
            background: #0b0d0c; /* Fondo oscuro atmosférico */
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
        }
        #controles {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: min(600px, 90%);
            display: flex;
            gap: 8px;
            z-index: 2;
        }
        #youtubeUrl {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #1a1c1b;
            color: white;
        }
        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            background: #fff;
            color: #111;
            font-weight: bold;
        }
        #estado {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 13px;
            color: #aaa; /* Texto claro para fondo oscuro */
            z-index: 2;
        }
        #reproductor {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #aaa; /* Texto claro */
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #reproductor.visible,
        #reproductor:hover {
            opacity: 0.9;
        }
        #reproductor button {
            padding: 0 6px;
            background: transparent;
            color: white;
            font-size: 16px;
        }
        #barra {
            width: 260px;
            height: 3px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }
        #barraRelleno {
            height: 100%;
            width: 0%;
            background: white;
        }
        #volumen {
            width: 80px;
            accent-color: white;
        }
    </style>
</head>
<body>
    <div id="controles">
        <input id="youtubeUrl" type="url" placeholder="Pega una URL de YouTube">
        <button id="reproducir">Reproducir</button>
    </div>
    <div id="estado">Introduce una URL para comenzar.</div>
    <audio id="audio" style="display: none;"></audio>
    <div id="reproductor">
        <button id="playPausa">⏯</button>
        <span id="tiempo">0:00</span>
        <div id="barra"><div id="barraRelleno"></div></div>
        <span id="total">--:--</span>
        <input id="volumen" type="range" min="0" max="1" step="0.01" value="1">
    </div>
    <canvas id="canvas"></canvas>

    <script src="audio.js"></script>
    <script src="deteccion.js"></script>
    <script src="bola.js"></script>
    <script src="ola.js"></script>
    <script src="anillos.js"></script>
    <script src="grosor.js"></script>
    <script src="color.js"></script>
    <script src="main.js"></script>
</body>
</html>
