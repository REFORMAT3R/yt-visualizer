<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador musical</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #111;
        }
        #controles {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: min(600px, 90%);
            display: flex;
            gap: 8px;
            z-index: 2;
        }
        #youtubeUrl {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #222;
            color: white;
        }
        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            background: white;
            color: #111;
            font-weight: bold;
        }
        #estado {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 13px;
            color: #ccc;
            z-index: 2;
        }
        #reproductor {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #ccc;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #reproductor.visible,
        #reproductor:hover {
            opacity: 0.8;
        }
        #reproductor button {
            padding: 0 6px;
            background: transparent;
            color: white;
            font-size: 16px;
        }
        #barra {
            width: 260px;
            height: 3px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }
        #barraRelleno {
            height: 100%;
            width: 0%;
            background: #bbb;
        }
        #volumen {
            width: 80px;
            accent-color: #bbb;
        }
    </style>
</head>
<body>
    <div id="controles">
        <input id="youtubeUrl" type="url" placeholder="Pega una URL de YouTube">
        <button id="reproducir">Reproducir</button>
    </div>
    <div id="estado">Introduce una URL para comenzar.</div>
    <audio id="audio"></audio>
    <div id="reproductor">
        <button id="playPausa">⏯</button>
        <span id="tiempo">0:00</span>
        <div id="barra"><div id="barraRelleno"></div></div>
        <span id="total">--:--</span>
        <input id="volumen" type="range" min="0" max="1" step="0.01" value="1">
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const audio = document.getElementById("audio");
        const boton = document.getElementById("reproducir");
        const entradaUrl = document.getElementById("youtubeUrl");
        const estado = document.getElementById("estado");
        const volumen = document.getElementById("volumen");
        const tiempoTxt = document.getElementById("tiempo");
        const totalTxt = document.getElementById("total");
        const barra = document.getElementById("barra");
        const barraRelleno = document.getElementById("barraRelleno");

        // TAMAÑO RESPONSIVE
        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", ajustarCanvas);
        ajustarCanvas();

        // BANDAS (frecuencia central en Hz)
        const ANCHO_BANDA = 1.25;
        const bandas = [
            { f: 60,    etq: "60 Hz" },
            { f: 150,   etq: "150 Hz" },
            { f: 400,   etq: "400 Hz" },
            { f: 1000,  etq: "1 kHz" },
            { f: 2500,  etq: "2.5 kHz" },
            { f: 5000,  etq: "5 kHz" },
            { f: 8000,  etq: "8 kHz" },
            { f: 12000, etq: "12 kHz" },
            { f: 16000, etq: "16 kHz" }
        ];
        const BANDA_OLA = 1;            // índice de la banda que dispara la ola (1 = 150 Hz)
        const N = bandas.map(() => 0);
        const valores = N.slice();      // nivel suavizado de cada banda (para el tamaño base)
        const medias = N.slice();       // nivel normal de cada banda
        const previos = N.slice();      // nivel del frame anterior
        const ultimoPulsoBanda = N.slice();
        const pulsosBanda = bandas.map(() => []);  // tiempos de pulsos por banda
        const pps = N.slice();          // pulsos por segundo de cada banda

        // AJUSTES DE NIVEL
        const MEDIA_VEL = 0.015;
        const EXCESO = 5;
        const ATAQUE = 0.6;
        const CAIDA = 0.20;

        // DETECCIÓN DE PULSOS (cada banda tiene su detector)
        const UMBRAL_EXCESO = 0.05;     // cuánto debe superar a su promedio
        const CAMBIO_MIN = 0.015;       // subida mínima respecto al frame anterior
        const INTERVALO_MIN = 150;      // ms mínimos entre pulsos de una misma banda
        const VENTANA_PPS = 2000;       // ms para contar pulsos por segundo
        const ARRANQUE_MS = 2000;       // al empezar, el promedio se adapta rápido

        // ELECCIÓN DE LA BANDA GUÍA DE LA BOLA
        const PPS_MIN = 2.1;            // una banda con menos pulsos/s no cuenta (está muerta)
        const VENTAJA_CAMBIO = 1;       // la nueva debe tener 1 pulso/s menos para quitarle el puesto
        const ESPERA_CAMBIO = 1500;     // ms mínimos entre cambios de banda guía
        let guia = -1;
        let ultimoCambioGuia = 0;

        // GOLPES SECOS (solo uno por frame: gana la banda con más exceso)
        const GOLPE_EXCESO = 0.10;      // cuánto debe superar a su promedio
        const GOLPE_INTERVALO = 200;    // ms mínimos entre golpes secos de TODA la bola
        const GOLPE_FUERZA = 1.2;       // cuánto late la bola con un golpe seco
        let ultimoGolpe = 0;

        // BOLA
        let fuerzaPulso = 0;
        let tempoMs = 400;
        const tiemposGuia = [];
        const FACTOR_RELAJ = 0.9;       // más alto = la bola tarda más en volver
        const CRECE_PROMEDIO = 0.08;    // cuánto crece la bola con el nivel promedio
        let radioSuave = 0;
        const SUAVIZADO_BOLA = 0.35;   // más bajo = más lento y suave (0.15 muy suave, 0.6 casi sin suavizar)

        // OLA (se activa con un cambio brusco en la banda BANDA_OLA)
        const anchoInicial = Math.PI / 1.4;
        const anchoFinal = Math.PI / 5;
        const inicio = 0;
        const final = -Math.PI;
        const OLA_VENTANA = 100;        // ms en los que se mide el salto
        const OLA_SALTO_MIN = 0.08;     // salto mínimo para lanzar una ola (más alto = menos olas)
        const OLA_REL = 2.6;              // el salto debe superar X veces el salto típico de la banda
        const OLA_SALTO_MAX = 0.30;     // salto que da la ola de altura máxima
        const OLA_ALTURA_MIN = 0.3;     // altura mínima (proporción) de cualquier ola
        const OLA_INTERVALO = 300;      // ms mínimos entre olas
        const OLA_DURACION = 0.45;       // segundos que tarda en recorrer medio círculo
        const histOla = [];             // {t, v} de los últimos OLA_VENTANA ms
        let variacionOla = 0;           // salto típico de la banda
        let anguloCentro = inicio;
        let recorridoActivo = false;
        let alturaOla = 0;
        let ultimaOla = 0;

        // DEPURACIÓN (pon true para ver la banda guía bajo la bola)
        const MOSTRAR_DEBUG = false;

        let musicaIniciada = false;
        let inicioMusica = 0;
        let ultimoFrame = performance.now();

        // ANALIZADOR DE AUDIO
        let contextoAudio = null;
        let analizador = null;
        let fuenteAudio = null;
        let ganancia = null;
        let datosFrecuencia = null;

        async function prepararAudio() {
            if (!contextoAudio) {
                contextoAudio = new (
                    window.AudioContext || window.webkitAudioContext
                )();
                analizador = contextoAudio.createAnalyser();
                analizador.fftSize = 2048;
                analizador.smoothingTimeConstant = 0.5;
                datosFrecuencia = new Uint8Array(analizador.frequencyBinCount);
                fuenteAudio = contextoAudio.createMediaElementSource(audio);

                // El analizador lee la señal cruda; el volumen se aplica DESPUÉS
                fuenteAudio.connect(analizador);
                ganancia = contextoAudio.createGain();
                ganancia.gain.value = parseFloat(volumen.value);
                analizador.connect(ganancia);
                ganancia.connect(contextoAudio.destination);
            }
            if (contextoAudio.state === "suspended") {
                await contextoAudio.resume();
            }
        }

        volumen.addEventListener("input", () => {
            if (ganancia) ganancia.gain.value = parseFloat(volumen.value);
        });

        // Nivel (0-1) de cada banda
        function leerBandas() {
            const salida = bandas.map(() => 0);
            if (!analizador || audio.paused) return salida;

            analizador.getByteFrequencyData(datosFrecuencia);
            const hzPorBin = contextoAudio.sampleRate / analizador.fftSize;
            const maxBin = datosFrecuencia.length - 1;

            bandas.forEach((b, k) => {
                const ini = Math.max(1, Math.floor((b.f / ANCHO_BANDA) / hzPorBin));
                const fin = Math.min(maxBin, Math.ceil((b.f * ANCHO_BANDA) / hzPorBin));
                if (ini > maxBin) return;
                let suma = 0;
                let n = 0;
                for (let i = ini; i <= fin; i++) {
                    suma += datosFrecuencia[i];
                    n++;
                }
                salida[k] = n ? suma / n / 255 : 0;
            });
            return salida;
        }

        // CONTROLES PROPIOS
        function formatear(s) {
            s = Math.max(0, Math.floor(s));
            return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
        }

        document.getElementById("playPausa").addEventListener("click", () => {
            if (!audio.src) return;
            if (audio.paused) audio.play();
            else audio.pause();
        });

        // Los controles aparecen al mover el mouse y se esconden a los 2.5 s
        const panel = document.getElementById("reproductor");
        let temporizadorPanel = null;
        window.addEventListener("mousemove", () => {
            panel.classList.add("visible");
            clearTimeout(temporizadorPanel);
            temporizadorPanel = setTimeout(() => {
                panel.classList.remove("visible");
            }, 2500);
        });

        audio.addEventListener("timeupdate", () => {
            tiempoTxt.textContent = formatear(audio.currentTime);
            const d = audio.duration;
            if (isFinite(d) && d > 0) {
                totalTxt.textContent = formatear(d);
                barraRelleno.style.width =
                    Math.min(100, (audio.currentTime / d) * 100) + "%";
            }
        });

        barra.addEventListener("click", e => {
            const d = audio.duration;
            if (!isFinite(d) || d <= 0) return;
            const r = barra.getBoundingClientRect();
            audio.currentTime = ((e.clientX - r.left) / r.width) * d;
        });

        // REPRODUCIR DESDE YOUTUBE
        boton.addEventListener("click", async () => {
            const url = entradaUrl.value.trim();
            if (!/^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url)) {
                estado.textContent = "Introduce una URL válida de YouTube.";
                return;
            }
            try {
                boton.disabled = true;
                estado.textContent = "Cargando música...";
                await prepararAudio();
                audio.src = "/audio?url=" + encodeURIComponent(url);
                audio.load();
                await audio.play();
                musicaIniciada = true;
                inicioMusica = performance.now();
                valores.fill(0);
                medias.fill(0);
                previos.fill(0);
                ultimoPulsoBanda.fill(0);
                pps.fill(0);
                pulsosBanda.forEach(p => (p.length = 0));
                tiemposGuia.length = 0;
                guia = -1;
                ultimoCambioGuia = 0;
                ultimoGolpe = 0;
                fuerzaPulso = 0;
                tempoMs = 400;
                histOla.length = 0;
                variacionOla = 0;
                anguloCentro = inicio;
                recorridoActivo = false;
                alturaOla = 0;
                ultimaOla = 0;
                barraRelleno.style.width = "0%";
                totalTxt.textContent = "--:--";
                estado.textContent = "Música reproduciéndose.";
            } catch (error) {
                console.error(error);
                estado.textContent =
                    "No se pudo reproducir. Revisa la URL y la consola del servidor.";
            } finally {
                boton.disabled = false;
            }
        });

        // DIBUJAR
        function dibujar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const ahora = performance.now();
            const dt = Math.min(0.05, (ahora - ultimoFrame) / 1000);
            ultimoFrame = ahora;
            const factor = dt * 60;
            const activo = musicaIniciada && !audio.paused;

            const nivel = leerBandas();
            const ataque = 1 - Math.pow(1 - ATAQUE, factor);
            const caida = 1 - Math.pow(1 - CAIDA, factor);
            const rapidezMedia =
                ahora - inicioMusica < ARRANQUE_MS ? 0.15 : MEDIA_VEL;

            let pulsoGuia = false;
            let golpeSeco = false;
            let mejorGolpe = 0;   // el exceso más alto de este frame

            for (let k = 0; k < bandas.length; k++) {
                // Promedio lento y exceso sobre él
                medias[k] += (nivel[k] - medias[k]) * (1 - Math.pow(1 - rapidezMedia, factor));
                const exceso = Math.max(0, nivel[k] - medias[k]);

                // Nivel suavizado (sirve para el tamaño base de la bola)
                const o = Math.min(1, exceso * EXCESO);
                valores[k] += (o - valores[k]) * (o > valores[k] ? ataque : caida);

                // Detector de pulsos de esta banda
                const hayPulso =
                    activo &&
                    ahora - inicioMusica > 500 &&
                    exceso > UMBRAL_EXCESO &&
                    nivel[k] - previos[k] > CAMBIO_MIN &&
                    ahora - ultimoPulsoBanda[k] >= INTERVALO_MIN;

                if (hayPulso) {
                    ultimoPulsoBanda[k] = ahora;
                    pulsosBanda[k].push(ahora);
                    if (k === guia && pps[k] >= PPS_MIN) pulsoGuia = true;
                }

                // Golpe seco: candidata si es fuerte y la banda casi no da pulsos
                if (
                    activo &&
                    ahora - inicioMusica > 500 &&
                    exceso > GOLPE_EXCESO &&
                    nivel[k] - previos[k] > CAMBIO_MIN &&
                    pps[k] < PPS_MIN &&
                    exceso > mejorGolpe
                ) {
                    mejorGolpe = exceso;
                }

                previos[k] = nivel[k];
                const lista = pulsosBanda[k];
                while (lista.length && ahora - lista[0] > VENTANA_PPS) lista.shift();
                pps[k] = lista.length / (VENTANA_PPS / 1000);
            }

            // Solo un golpe seco: el de la banda más alta, con cooldown global
            if (mejorGolpe > 0 && ahora - ultimoGolpe >= GOLPE_INTERVALO) {
                ultimoGolpe = ahora;
                golpeSeco = true;
            }

            // ---- ELEGIR LA BANDA GUÍA: la que menos pulsos/s da (entre las vivas) ----
            let mejor = -1;
            for (let k = 0; k < bandas.length; k++) {
                if (pps[k] < PPS_MIN) continue;
                if (mejor === -1 || pps[k] < pps[mejor]) mejor = k;
            }
            const guiaMuerta = guia === -1 || pps[guia] < PPS_MIN;
            if (mejor !== -1 && mejor !== guia) {
                if (guiaMuerta) {
                    guia = mejor;
                    ultimoCambioGuia = ahora;
                    tiemposGuia.length = 0;
                } else if (
                    pps[mejor] < pps[guia] - VENTAJA_CAMBIO &&
                    ahora - ultimoCambioGuia > ESPERA_CAMBIO
                ) {
                    guia = mejor;
                    ultimoCambioGuia = ahora;
                    tiemposGuia.length = 0;
                }
            }

            // ---- PULSO DE LA BOLA ----
            if (golpeSeco) {
                fuerzaPulso = Math.max(fuerzaPulso, GOLPE_FUERZA);
            }
            if (pulsoGuia) {
                fuerzaPulso = 1;
                tiemposGuia.push(ahora);
                while (tiemposGuia.length > 12) tiemposGuia.shift();
                if (tiemposGuia.length >= 5) {
                    const ints = [];
                    for (let i = 1; i < tiemposGuia.length; i++) {
                        ints.push(tiemposGuia[i] - tiemposGuia[i - 1]);
                    }
                    ints.sort((a, b) => a - b);
                    const mediana = ints[Math.floor(ints.length / 2)];
                    tempoMs += (Math.min(900, Math.max(120, mediana)) - tempoMs) * 0.15;
                }
            }
            // La bola se relaja en ~70 % del tiempo entre pulsos
            const framesPorPulso = (tempoMs / 1000) * 60;
            const decaimiento = Math.pow(0.05, 1 / (framesPorPulso * FACTOR_RELAJ));
            fuerzaPulso *= Math.pow(decaimiento, factor);

            // ---- DETECTAR CAMBIO BRUSCO PARA LA OLA ----
            const nivelOla = nivel[BANDA_OLA];
            histOla.push({ t: ahora, v: nivelOla });
            while (histOla.length && ahora - histOla[0].t > OLA_VENTANA) histOla.shift();
            let minimo = nivelOla;
            for (const h of histOla) if (h.v < minimo) minimo = h.v;
            const salto = nivelOla - minimo;   // cuánto subió en los últimos OLA_VENTANA ms

            const umbralOla = Math.max(OLA_SALTO_MIN, variacionOla * OLA_REL);
            if (
                activo &&
                ahora - inicioMusica > 1000 &&
                !recorridoActivo &&
                salto > umbralOla &&
                ahora - ultimaOla >= OLA_INTERVALO
            ) {
                ultimaOla = ahora;
                recorridoActivo = true;
                anguloCentro = inicio;
                // La altura depende de qué tan brusco fue el salto
                alturaOla = Math.max(OLA_ALTURA_MIN, Math.min(1, salto / OLA_SALTO_MAX));
            }
            // Salto típico de la banda (se adapta a cada canción)
            variacionOla += (salto - variacionOla) * (1 - Math.pow(1 - 0.02, factor));

            // Nivel promedio de todas las bandas (para el tamaño base)
            const promedio = valores.reduce((a, b) => a + b, 0) / valores.length;

            // ---- BOLA (centrada) ----
            const bolaX = canvas.width / 2;
            const bolaY = canvas.height / 2;
            const radio = Math.min(canvas.width, canvas.height) * 0.23;
            const radioObjetivo =
                radio * (1 + CRECE_PROMEDIO * promedio * 3) + fuerzaPulso * radio * 0.19;
                if (radioSuave === 0) radioSuave = radioObjetivo;
                radioSuave += (radioObjetivo - radioSuave) * (1 - Math.pow(1 - SUAVIZADO_BOLA, factor));
                const radioBola = radioSuave;

            ctx.beginPath();
            for (let i = 0; i <= 240; i++) {
                const a = (i / 240) * Math.PI * 2;
                const x = bolaX + Math.cos(a) * radioBola;
                const y = bolaY + Math.sin(a) * radioBola;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.stroke();

            // ---- OLA ----
            if (recorridoActivo) {
                let progreso = (inicio - anguloCentro) / (inicio - final);
                progreso = Math.max(0, Math.min(1, progreso));

                // La ola crece hasta el 40 % del recorrido y después disminuye
                let progresoAltura;
                if (progreso <= 0.4) progresoAltura = progreso / 0.4;
                else progresoAltura = 1 - (progreso - 0.4) / 0.6;
                progresoAltura = Math.max(0, progresoAltura);

                const altura = progresoAltura * alturaOla * radio * 0.95;
                const ancho = anchoInicial + (anchoFinal - anchoInicial) * progreso;
                const anguloA = anguloCentro + ancho / 2;
                const pasosOla = 120;

                // Relleno
                ctx.beginPath();
                for (let i = 0; i <= pasosOla; i++) {
                    const t = i / pasosOla;
                    const ang = anguloA - t * ancho;
                    const forma = Math.pow(Math.sin(t * Math.PI), 2.1);
                    const r = radioBola + forma * altura;
                    const x = bolaX + Math.cos(ang) * r;
                    const y = bolaY + Math.sin(ang) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                for (let i = pasosOla; i >= 0; i--) {
                    const t = i / pasosOla;
                    const ang = anguloA - t * ancho;
                    ctx.lineTo(
                        bolaX + Math.cos(ang) * radioBola,
                        bolaY + Math.sin(ang) * radioBola
                    );
                }
                ctx.closePath();
                ctx.fillStyle = "white";
                ctx.fill();

                // Borde
                ctx.beginPath();
                for (let i = 0; i <= pasosOla; i++) {
                    const t = i / pasosOla;
                    const ang = anguloA - t * ancho;
                    const forma = Math.pow(Math.sin(t * Math.PI), 2.1);
                    const r = radioBola + forma * altura;
                    const x = bolaX + Math.cos(ang) * r;
                    const y = bolaY + Math.sin(ang) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = "white";
                ctx.lineWidth = 5;
                ctx.stroke();

                // Avanza (siempre termina su recorrido)
                if (activo) {
                    anguloCentro -= (Math.PI / (OLA_DURACION * 60)) * factor;
                    if (anguloCentro <= final) {
                        anguloCentro = final;
                        recorridoActivo = false;
                    }
                }
            }

            if (MOSTRAR_DEBUG) {
                ctx.fillStyle = "#888";
                ctx.font = "13px Arial";
                ctx.textAlign = "center";
                ctx.fillText(
                    guia === -1
                        ? "sin banda guía"
                        : `guía: ${bandas[guia].etq} · ${pps[guia].toFixed(1)} pulsos/s`,
                    bolaX,
                    bolaY + radio * 1.5
                );
            }

            requestAnimationFrame(dibujar);
        }
        dibujar();
    </script>
</body>
</html>
